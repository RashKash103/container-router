# github workflow for building this package
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    push-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup mise
              uses: jdx/mise-action@v4
              with:
                install: true         # run `mise install`
                cache: true           # enable caching
                experimental: true    # optional: enable experimental features

            - name: Verify node installation
              run: node --version

            - name: Verify yarn installation
              run: yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Test
              run: yarn test

            # Builds before linting: web-ext lint reads build/webpack, which
            # does not exist until the build has run.
            - name: Build
              run: gulp dist

            - name: Lint
              run: yarn lint
